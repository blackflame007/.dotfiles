# The operator's own layout on the Wick: LAB down the dark left wall as tall as his lab needs,
# the machine under it; VECTOR and the lab's alerts in the column beside them; CI and pull
# requests under the window; the den TV's remote along the bottom. The den's screens, TVs
# and window stay clear. Widgets that fit their content (LAB, ALERTS, CI) get the height
# their content needs, inside their size class (docs/widgets.md, "Fitting to content").
title = "My desk"
description = "The lab and its alerts, VECTOR, CI and pull requests, this machine, and the den TV's remote"
archetype = "personal"
budget = 0.45

[[widget]]
name = "lab"
size = "standard"
small = "compact"
side = "left"
fit = "content"
priority = 1

[[widget]]
name = "system"
size = "compact"
side = "left"
priority = 3

[[widget]]
name = "vector"
size = "standard"
small = "compact"
side = "left"
lane = 2
priority = 1

[[widget]]
name = "alerts"
size = "standard"
small = "compact"
side = "left"
lane = 2
fit = "content"
priority = 2

[[widget]]
name = "ci"
size = "standard"
small = "compact"
side = "right"
from = "bottom"
fit = "content"
priority = 2

[[widget]]
name = "media"
size = "wide"
small = "compact"
side = "bottom"
priority = 2
