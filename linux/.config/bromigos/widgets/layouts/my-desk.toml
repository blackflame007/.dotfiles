# The operator's own layout: the lab and VECTOR first, then his code, what's playing, and the
# machine. Two columns on the Wick's dark left wall, a pair under the window; the den's
# screens, TVs and window stay clear.
title = "My desk"
description = "The lab, its alerts and jobs, VECTOR, CI and GitHub on the left wall; the machine and what's playing under the window"
archetype = "personal"
budget = 0.4

[[widget]]
name = "lab"
size = "standard"
small = "compact"
side = "left"
priority = 1

[[widget]]
name = "alerts"
size = "standard"
small = "compact"
side = "left"
priority = 2

[[widget]]
name = "labjobs"
size = "standard"
small = "compact"
side = "left"
priority = 4

[[widget]]
name = "vector"
size = "standard"
small = "compact"
side = "left"
lane = 2
priority = 1

[[widget]]
name = "ci"
size = "standard"
small = "compact"
side = "left"
lane = 2
priority = 2

[[widget]]
name = ["github", "gitlab"]
size = "standard"
small = "compact"
side = "left"
lane = 2
priority = 4

[[widget]]
name = "system"
size = "compact"
side = "right"
from = "bottom"
priority = 3

[[widget]]
name = "nowplaying"
size = "compact"
side = "right"
from = "bottom"
lane = 2
priority = 5
