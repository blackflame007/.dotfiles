# btrbk: daily off-drive copy of the root filesystem (@) to the ext4 /mnt/Data drive.
# Installed to /etc/btrbk/btrbk.conf by setup-snapshots.sh; btrbk.timer runs it daily.
# The target is "raw": incremental `btrfs send` streams stored as files, because
# /mnt/Data is ext4 and can't receive subvolumes. Restore: `btrbk ... restore` or
# `btrfs receive` the full stream, then each incremental in order.

timestamp_format        long
snapshot_preserve_min   2d
snapshot_preserve       14d
target_preserve_min     no
target_preserve         14d

# Top level of the system btrfs (subvolid=5), automounted by setup-snapshots.sh.
volume /mnt/btrfs-top
  snapshot_dir          @btrbk_snaps
  subvolume @
    snapshot_create     always
    target raw          /mnt/Data/btrbk
      raw_target_compress   zstd
      incremental           yes
