# btrbk: daily off-drive copy of root (@) and /home (@home) to the NAS.
# Installed to /etc/btrbk/btrbk.conf by setup-snapshots.sh. btrbk.timer runs it
# daily through /usr/local/lib/bromigos/btrbk-nas (a btrbk.service drop-in),
# which skips cleanly when the NAS is unreachable, sends a full stream weekly
# (--override=incremental=no) and prunes whole incremental chains past 14 days.
# btrbk itself never deletes incremental raw files, so that pruning lives there.
#
# The target is "raw": `btrfs send` streams stored as zstd files, because the
# NAS share is NFS and can't receive subvolumes. /mnt/nas-backups is an NFS
# automount (soft, timeouts) written into fstab by setup-snapshots.sh.
# Restore: `btrfs receive` the full stream, then each incremental in order
# (each .info file names its parent), e.g.
#   zstd -dc @home.<ts>.btrfs.zst | btrfs receive /mnt/btrfs-top/restore/

timestamp_format        long
snapshot_preserve_min   2d
snapshot_preserve       14d
target_preserve_min     no
target_preserve         14d

# Top level of the system btrfs (subvolid=5), automounted by setup-snapshots.sh.
volume /mnt/btrfs-top
  snapshot_dir          @btrbk_snaps
  snapshot_create       always
  target raw            /mnt/nas-backups/btrbk
    raw_target_compress   zstd
    incremental           yes
  subvolume @
  subvolume @home
