# bromigos peripheral: my device modules (bromigOS's docs/peripherals.md). The Razer
# BlackWidow V4 Pro runs bromigOS's razer-keyboard module with my side button 1;
# `bromigos peripheral enable razer-keyboard` turns it on.
[razer-keyboard.keys]
side1 = "bromigos-live arbiter"   # the ARBITER deck (my plugin), not the menu
