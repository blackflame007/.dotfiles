# Where bromigOS makes things: images, edits, cutouts, video loops, 3D models
# (`bromigos art`, VECTOR's `create`, the hologram tools). Format: bromigOS docs/art.md,
# "Creation providers"; `bromigos setup create` rewrites this interactively.
#
# My rule: the homelab first, always. A cloud provider (nolgia, credits) only where the
# lab has no model for the job: today that's video loops. Change a capability's
# `providers` to switch; "none" stops the list (never fall through to the cloud).
format = 1

# The 5090's ComfyUI. Its address is the `comfyui` source in homelab.toml (which reads
# it from my encrypted private overlay), so no hostname lands in this public file.
[comfyui.homelab]
endpoint = "@homelab:comfyui"

[nolgia]
enabled = true

[image.generate]
providers = ["comfyui:homelab", "none"]     # Qwen-Image-2.1
comfyui = "qwen-image-2.1"
nolgia = "gpt-image-2.5-flare"

[image.edit]
providers = ["comfyui:homelab", "none"]     # Qwen-Image-2.1 edit
comfyui = "qwen-image-2.1"
nolgia = "gpt-image-2.5-flare"

[image.cutout]
providers = ["comfyui:homelab", "none"]     # BiRefNet
comfyui = "birefnet"
nolgia = "remove-background"

[model3d.generate]
providers = ["comfyui:homelab", "none"]     # Hunyuan3D 2.1 (shape)
comfyui = "hunyuan3d-2.1"
nolgia = "trellis"

[video.loop]
providers = ["nolgia"]                      # no lab model for seamless loops yet
nolgia = "seedance-2.5"
