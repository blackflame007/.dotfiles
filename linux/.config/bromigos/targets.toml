# Where my AI work runs (bromigOS docs/targets.md): the art tools, VECTOR's voice and
# hearing, his brain. `bromigos target` shows what each would use now; `bromigos target
# homelab|local|cloud` switches it (VECTOR can't: it's my setting).
#
# My rule: the homelab first, then this machine; never the cloud (credits) where either
# can do the job. Video loops included: the lab's ComfyUI makes them with Wan 2.2
# (`bromigos target probe video.loop`). The cloud only when I ask for it, one job at a
# time: `bromigos art make video.loop --provider nolgia …`. The homelab's addresses are
# the packaged defaults' references (@homelab:comfyui, @homelab:voice, @homelab:litellm
# in homelab.toml, which reads them from my encrypted private overlay), so no hostname
# lands in this public file.
format = 1

[targets]
order = ["homelab", "local"]
