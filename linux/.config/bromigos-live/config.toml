# bromigos-live: my changes over bromigOS's packaged live layer config
# (/usr/share/bromigos/live/config.toml, every key documented there). The loader merges
# this file key by key over it, then my animation switches (bromigos anim …,
# ~/.config/bromigos/live/overrides.toml). The daemon reloads on save.

[general]
monitor = "DP-1"         # my one screen (empty = the primary output, chosen automatically)

[background]
# my den: the operator's plates (likeness art, kept in this repo's wallpaper/ package)
underlay_fallback = "~/.config/wallpaper/bromigos-den-2560x1440.jpg"
den_plate = "~/.config/wallpaper/bromigos-den-2560x1440-v1.jpg"

[swarm]                  # SUPER+SHIFT+S: the repos under ~/github.com/<org>, one orbit per org (inner first)
orgs = ["bromigos-org", "nolgiainc", "blackflame007"]
rings = { "bromigos-org" = 0.48, "nolgiainc" = 0.80, "blackflame007" = 1.10 }

[cluster]
token_file = "~/.local/share/bromigos/lab-token"
