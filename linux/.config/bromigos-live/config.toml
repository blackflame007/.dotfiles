# bromigos-live: my changes over bromigOS's packaged live layer config
# (/usr/share/bromigos/live/config.toml, every key documented there). The loader merges
# this file key by key over it, then my animation switches (bromigos anim …,
# ~/.config/bromigos/live/overrides.toml). The daemon reloads on save.

[general]
monitor = "DP-1"         # my one screen (empty = the primary output, chosen automatically)

[background]
# my den: the operator's plates (likeness art, kept in this repo's wallpaper/ package)
underlay_fallback = "~/.config/wallpaper/bromigos-den-2560x1440.jpg"
den_plate = "~/.config/wallpaper/bromigos-den-2560x1440-v1.jpg"

[swarm]                  # SUPER+SHIFT+S: the repos under ~/github.com/<org>, one orbit per org (inner first)
orgs = ["bromigos-org", "nolgiainc", "blackflame007"]
rings = { "bromigos-org" = 0.48, "nolgiainc" = 0.80, "blackflame007" = 1.10 }

[driftmap]               # SUPER+M: my platform checkout's full canon, not the public catalog the package ships
catalog = "~/github.com/bromigos-org/platform/agents/lore/catalog.json"

[cluster]
token_file = "~/.local/share/bromigos/lab-token"

[fills]                  # ARBITER's paper fills: rain bursts, the worlds' catches, FLOOR codec calls
endpoint = "arbiter"     # the private overlay's endpoints.arbiter

[decks]                  # Tab: my ARBITER deck second, the replay last (both plugins in bromigos/plugins/live)
cycle = ["holodeck", "arbiter", "timeline", "mind", "ops", "swarm", "netmap", "replay"]

[radial]                 # SUPER+A: the packaged ring with ARBITER first
items = [
  { name = "ARBITER",   sub = "THE FLOOR",       endpoint = "arbiter", stat = "fills" },
  { stat = "lab",       sub = "LAB",             endpoint = "lab" },
  { name = "ARGO",      sub = "FLEET SYNC",      endpoint = "argocd" },
  { name = "GRAFANA",   sub = "TELEMETRY",       endpoint = "grafana" },
  { name = "LITELLM",   sub = "MODEL GATEWAY",   endpoint = "litellm" },
  { name = "TERMINAL",  sub = "KITTY",           cmd = "kitty" },
  { name = "BROWSER",   sub = "WEB",             cmd = "xdg-open about:blank" },
  { name = "NOTES",     sub = "FIELD NOTES",     cmd = "kitty --class bromigos-notes -e nvim ~/notes" },
]

# The den TV (bromigOS live/README.md, "The den TV"): my libraries as channels, each den
# screen playing its own at once, after its own picture (channel 1). Scroll over a screen
# to change channel; click for full screen with sound. Settings › Den TV (SUPER+ALT+G)
# is the channel guide: add, remove, reorder, pick shows.
[[tv.channel]]
name = "Shows"
source = "jellyfin"
library = "Shows"
screens = ["big"]

[[tv.channel]]
name = "Night Block"             # three shows taking turns, each going on where it left off
source = "jellyfin"
shows = ["Ghost in the Shell: Stand Alone Complex", "Final Space", "The Boondocks"]
order = "in order"
screens = ["big"]

[[tv.channel]]
name = "Movies"                  # the small monitor, shuffled
source = "jellyfin"
library = "Movies"
order = "shuffle"
screens = ["emblem"]

[[tv.channel]]
name = "YouTube"                 # the downloaded YouTube library, on the scope: offline, no ads
source = "jellyfin"
library = "YouTube"
order = "in order"
screens = ["wave"]

[[tv.channel]]
name = "Anime Fights"            # a YouTube playlist, streamed (yt-dlp): no download needed
youtube = "https://www.youtube.com/playlist?list=PL6pEyKSSREwSLAt-ybYdLM-LPocXkwP4D"
order = "in order"

[[tv.channel]]
name = "Anime Openings"          # a YouTube playlist of 1,000+ openings, streamed (yt-dlp)
youtube = "https://www.youtube.com/playlist?list=PLzSjbEiFKZ_w9zWXjVSTLi5FUlcPHwQCc"
order = "shuffle"
