# ---- BROMIGOS LIVE: animated live layer (~/.config/bromigos-live) ----------------
# Background shader layer + event overlays + holo gadgets. Toggles: bromigos-live/config.toml.
exec-once=~/.config/bromigos-live/bin/bromigos-live start --login
layerrule = no_anim on, match:namespace ^(bromigos-live.*)$
# Holo deck: arc rings, cluster constellation, machine hologram (Esc closes).
bind=SUPER,H,exec,~/.config/bromigos-live/bin/bromigos-live holodeck
# ARBITER deck: the Floor as a hologram (read-only; Tab switches to the local deck).
bind=SUPER,G,exec,~/.config/bromigos-live/bin/bromigos-live arbiter
# Drift map: the lore catalog as a star chart; the lab's live services are its lit relays.
bind=SUPER,M,exec,~/.config/bromigos-live/bin/bromigos-live driftmap
# Radial quick-launch (rofi stays the full launcher on ALT+P).
bind=SUPER,A,exec,~/.config/bromigos-live/bin/bromigos-live radial
# Live background on/off, sounds mute/unmute.
bind=SUPER SHIFT,B,exec,~/.config/bromigos-live/bin/bromigos-live toggle
bind=SUPER SHIFT,M,exec,~/.config/bromigos-live/bin/bromigos-live mute
# Codec calls without voice (quiet mode toggle).
bind=SUPER SHIFT,C,exec,~/.config/bromigos-live/bin/bromigos-live codec-quiet
# Scanner: pin the hardware schematic (toggle) / hold to scan (release hides it).
bind=SUPER,X,exec,~/.config/bromigos-live/bin/bromigos-live scan-pin
bind=SUPER,Z,exec,~/.config/bromigos-live/bin/bromigos-live scan-hold on
bindr=SUPER,Z,exec,~/.config/bromigos-live/bin/bromigos-live scan-hold off
# ---- END BROMIGOS LIVE ------------------------------------------------------------
