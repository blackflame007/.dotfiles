
# monitor=,1920x1080@60,0x0,1
# bitdepth must match physical monitor for screen sharing (check monitor OSD/specs; use 8 or 10)
monitor=DP-1,2560x1440@59.95,3440x0,1,bitdepth,10
monitor=DP-2,3440x1440@59.97,0x0,1,bitdepth,10
# monitor=HDMI-A-1,1920x1080@60,0x0,1
exec-once=waybar
# ---- BROMIGOS THEME: session start (wallpaper, widgets, idle) -------------------
# Static den wallpaper: the base under any live background layer.
# (previous: bleach_urahara.jpg on DP-1, monkey-d-luffy...jpg on DP-2)
# swaybg on the chosen den variant (choice is local state: ~/.local/state/bromigos/wallpaper)
exec-once=~/.config/bromigos/bin/bromigos-wallpaper apply
exec-once=~/.config/bromigos/widgets/bromigos-widgets
exec-once=hypridle
# Cursor theme (~/.config/bromigos/gtk/build-icons-cursor.py); GTK/icon themes are set with gsettings.
env=XCURSOR_THEME,Bromigos-cursor
env=XCURSOR_SIZE,24
exec-once=/usr/bin/hyprctl setcursor Bromigos-cursor 24
# ---- END BROMIGOS THEME: session start --------------------------------------------
exec-once=dunst
exec-once=$HOME/.local/share/hyprload/hyprload.sh
# gsettings set org.gnome.desktop.interface gtk-theme "Arc-Dark"
# gsettings set org.gnome.desktop.wm.preferences theme "Arc-dark"
# gsettings set org.gnome.desktop.interface icon-theme "Arc-X-D"

input {

  kb_options=caps:escape
  repeat_rate=50
  repeat_delay=240
  sensitivity=1.0 # for mouse cursor

  touchpad {
        disable_while_typing=1
        natural_scroll=1
        clickfinger_behavior=1
        middle_button_emulation=0
        tap-to-click=0
    }
}


general {

    layout=master

    # ---- BROMIGOS THEME: borders and gaps (previous: gaps 5/20, 0xff5e81ac / 0x66333333)
    gaps_in=4
    gaps_out=12
    border_size=2
    col.active_border=rgb(39ff14) rgb(159b09) 45deg
    col.inactive_border=rgba(003b00ee)
    # ---- END BROMIGOS THEME
}

decoration {
    # ---- BROMIGOS THEME: square corners, dark green shadow (previous: rounding 10)
    rounding=0
    shadow {
      enabled=true
      range=16
      render_power=3
      color=rgba(39ff1430)
      color_inactive=rgba(000500cc)
    }
    # ---- END BROMIGOS THEME
    blur {
      enabled=1
      size=3
      passes=1
    }
}

animations {
    enabled=1
    # ---- BROMIGOS THEME: crisp, quick (previous: windows 7, fade 10, workspaces 6, default curve)
    bezier=crisp,0.2,0.9,0.1,1
    bezier=snap,0.4,0,0.2,1
    animation=windows,1,3,crisp,popin 92%
    animation=windowsOut,1,2,snap,popin 92%
    animation=border,1,4,snap
    animation=fade,1,3,snap
    animation=layers,1,2,snap,fade
    animation=workspaces,1,3,crisp,slide
    # ---- END BROMIGOS THEME
}

# ---- BROMIGOS THEME: layer rules ------------------------------------------------
# Blur behind the translucent bar, launcher, notifications and desktop panels;
# ignore_alpha keeps blur off their fully transparent pixels.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.2, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.2, match:namespace notifications
layerrule = blur on, match:namespace bromigos-widgets
layerrule = ignore_alpha 0.2, match:namespace bromigos-widgets
# ---- END BROMIGOS THEME: layer rules --------------------------------------------

dwindle {
    force_split=2
    # preserve_split=1
}

master {
  new_on_top=true
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  mouse_move_enables_dpms=true
}

# example window rules
# for windows named/classed as abc and xyz
$mainMod=ALT


#windowrule=move 69 420,abc
#windowrule=size 420 69,abc
windowrule = tile on, match:class kitty
windowrule = tile on, match:class reStream
windowrule = tile on, match:class ffplay
# Android emulator: tiling stretches its frame while the phone stays
# phone-shaped, leaving a white slab. Float it at phone aspect instead.
windowrule = float on, match:class Emulator
windowrule = size 545 1224, match:class Emulator, match:title Android Emulator.*
windowrule = move 1975 86, match:class Emulator, match:title Android Emulator.*
# windowrule = opacity 0.80, match:class kitty
# windowrule = opacity 0.80, match:class kitty, match:title .*(nvim).*

windowrule = tile on, match:class librewolf
windowrule = tile on, match:class discord
windowrule = tile on, match:class spotify
windowrule = workspace 8, match:class discord
windowrule = workspace 2, match:class Google-chrome
windowrule = workspace 3, match:class Spotify
windowrule = workspace 4, match:class Steam
windowrule = workspace 9, match:class com.obsproject.Studio
# windowrule = opacity 0.90, match:class zsh
# windowrule = opacity 0.90, match:class kitty
# windowrule = opacity 1, match:class neovim
windowrule = opacity 0.80, match:class alacritty
# Apps (Chrome especially) ask to open maximized; ignore it so new windows tile.
windowrule = suppress_event maximize, match:class .*
windowrule = float on, match:class Rofi
windowrule = move 25% 40%, match:class Rofi
windowrule = size 50% 20%, match:class Rofi
windowrule = opacity 0.80, match:class Rofi
windowrule = center on, match:class Rofi
