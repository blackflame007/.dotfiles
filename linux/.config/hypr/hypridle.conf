# ---- BROMIGOS THEME: idle policy ---------------------------------------------------
# Lock at 10 min, displays off at 15. Never auto-suspends.
# Displays go through bromigos-dispatch: Lua dispatchers for hyprland.lua, the old
# `dpms on/off` form only if Hyprland is back on hyprland.conf.
general {
    lock_cmd = ~/.config/bromigos/bin/bromigos-lock   # relaunches the locker if it crashes; you still type your password
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.config/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "off" })' dpms off
    on-resume = ~/.config/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on
}
# ---- END BROMIGOS THEME: idle policy -----------------------------------------------

# ---- BROMIGOS LIVE: screensaver (bromigos-live) ------------------------------------
# Live scene full screen 2 min before the lock; any input ends it, the lock closes it.
listener {
    timeout = 480
    on-timeout = ~/.config/bromigos-live/bin/bromigos-live screensaver
    on-resume = ~/.config/bromigos-live/bin/bromigos-live screensaver-off
}
# ---- END BROMIGOS LIVE: screensaver ------------------------------------------------
