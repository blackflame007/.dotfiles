# gtklock: the Bromigos lock screen (replaces hyprlock's look; bromigos-lock runs it).
# The burn-in's ring turns in CSS (style.css), inside gtklock itself: nothing drives it
# from outside (signalling hyprlock for that crashed it, 2026-10-07).
[main]
style=/home/blackflame/.config/gtklock/style.css
layout=/home/blackflame/.config/gtklock/layout.ui
background=/home/blackflame/.local/state/bromigos/wallpaper/lock.jpg
time-format=%H:%M
date-format=%A %d %B %Y
idle-hide=false
