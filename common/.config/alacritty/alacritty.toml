# Bromigos palette (colours only; matches kitty/bromigos-macos.conf)
[colors.bright]
black = "#4e6b4e"
blue = "#8ccaf5"
cyan = "#8af5e2"
green = "#9cff8a"
magenta = "#e3a8ef"
red = "#ff9d97"
white = "#e6f5e6"
yellow = "#f0d36a"

[colors.cursor]
cursor = "#39ff14"
text = "#000500"

[colors.normal]
black = "#000500"
blue = "#5aa9e6"
cyan = "#3fe0c5"
green = "#39ff14"
magenta = "#c97bdb"
red = "#ff766f"
white = "#b4c8b4"
yellow = "#d4af37"

[colors.primary]
background = "#000500"
foreground = "#c4f5bb"

[colors.selection]
background = "#39ff14"
text = "#000500"

[cursor.style]
blinking = "Never"

[font]
size = 16.0

[font.bold]
family = "MesloLGM Nerd Font Bold"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "MesloLGM Nerd Font Italic"
style = "Italic"

[font.normal]
family = "MesloLGM Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[window]
dynamic_title = true
opacity = 0.7
decorations = "Buttonless"

[window.padding]
x = 2
y = 2
